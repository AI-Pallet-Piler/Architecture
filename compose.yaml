name: ai-pallet-piler
services:
  front-end-Web:
    container_name: front-end-Web
    build: ../front-end-Web

    ports:
      - "5173:5173"
    
    volumes:
      - ./../front-end-Web:/app
      - /app/node_modules
    depends_on:
      - backend

  front-end-App:
    container_name: front-end-App
    build: ../front-end-App
    depends_on:
      - backend

  backend:
    container_name: backend
    build: ../backend
    depends_on:
      - database
      - api-gateway

  api-gateway:
    container_name: api-gateway
    build: ../api-gateway

  security-api:
    container_name: security-api
    build: ../security-api
    
  database:
    container_name: postgres-database
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    restart: always